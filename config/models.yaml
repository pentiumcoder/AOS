# provider:model chains per role. first usable entry wins, the rest are fallbacks.
# providers without an API key get skipped, so with no keys everything runs on ollama.
# {ollama_model} -> OLLAMA_MODEL, {openai_reviewer_model} -> OPENAI_REVIEWER_MODEL

roles:
  supervisor:
    - anthropic:claude-opus-5-5
    - ollama:{ollama_model}

  reviewer:
    - openai:{openai_reviewer_model}
    - anthropic:claude-sonnet-5-5
    - ollama:{ollama_model}

  specialist:
    low:
      - anthropic:claude-haiku-5-5
      - ollama:{ollama_model}
    medium:
      - anthropic:claude-sonnet-5-5
      - ollama:{ollama_model}
    high:
      - anthropic:claude-sonnet-5-5
      - ollama:{ollama_model}

  default:
    - anthropic:claude-sonnet-5-5
    - ollama:{ollama_model}
